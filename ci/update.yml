# Per attivarlo: spostare in .github/workflows/update.yml (serve un token con scope "workflow").
# NON ATTIVO: si attiva solo dopo il push su GitHub. Per l'aggiornamento automatico togli il commento da "schedule".
name: aggiorna-bandi
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 5 * * *"   # ogni giorno alle 05:00 UTC
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/update.py
      - run: python scripts/build.py
      - run: |
          git config user.name "incentiviperte-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/bandi.json report.txt dist
          git commit -m "Aggiornamento bandi $(date -u +%F)" || echo "Nessuna modifica"
          git push
# Pubblicazione del sito: wrangler pages deploy dist --project-name=incentiviperte --branch=main
# Il branch gh-pages tiene solo il rimando generato da scripts/build_redirect.py.
